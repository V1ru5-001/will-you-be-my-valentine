<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Valentine</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="Giphs/hearts.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="container">
      <h1 class="h1-tag">Will you be my Valentine</h1>
      <img id="giphs" src="Giphs/giphy.gif" alt="" srcset="" />
      <div action="" class="yes-or-no" id="yes-or-no">
        <button type="submit" class="yes" id="yesBtn">YES</button>
        <button type="submit" class="no" id="noBtn">NO</button>
      </div>
    </main>
    <script src="index.js"></script>
  </body>
</html>
